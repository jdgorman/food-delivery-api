name: CD - Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: mvn -B -DskipTests clean package

      - name: Build info
        run: |
          echo "Build completed successfully"
          echo "Artifact: target/*.jar"
          ls -lh target/*.jar || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

      # Placeholder for actual AWS deployment
      - name: Ready for AWS deployment
        run: |
          echo "Application built and ready for deployment"
          echo "Next steps: Configure AWS credentials and deployment"